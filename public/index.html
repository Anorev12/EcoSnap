<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- CRITICAL: This script MUST be first in <head> to prevent flash -->
    <script>
      (function() {
        // Get saved theme IMMEDIATELY
        const savedTheme = localStorage.getItem("theme") || "light";
        
        // Determine actual theme
        let themeToUse = savedTheme;
        if (savedTheme === "system") {
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          themeToUse = prefersDark ? "dark" : "light";
        }
        
        // Apply theme BEFORE any CSS loads (no flash!)
        document.documentElement.setAttribute("data-theme", themeToUse);
        document.documentElement.style.colorScheme = themeToUse;
      })();
    </script>

    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="EcoSnap - Waste Classification App using AI"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>EcoSnap</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
